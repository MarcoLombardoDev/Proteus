name: Release

# One workflow, three real platforms.
#
# PyInstaller does not cross-compile: the only way to produce a genuine
# Windows executable, a macOS bundle and a Linux binary is to build each one
# on its own machine. GitHub hands out all three on demand, so the matrix
# below does exactly that — nothing here is a cross-build, and nothing is
# claimed for a platform that was not actually built.
#
# Two ways in, converging on the same result:
#
#   * a "v*" tag appears    — creates the release, then attaches the binaries.
#                             Pushing the tag with git does this, and so does
#                             publishing a release through GitHub's own UI,
#                             which creates the tag and fires the same push
#                             event.
#   * run it by hand        — pass the tag; attaches to that release
#
# Deliberately NOT also triggered by "release: published". That event and the
# tag's push event both fire when a release is published from the UI, and two
# runs then race to upload the same three asset names. One trigger, one run.
#
# Release assets are public, need no login, and never expire; workflow
# artifacts are none of those three. That is why the binaries are uploaded to
# the release rather than left attached to the run.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach the binaries to (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

# Two runs racing on the same tag would upload over each other's assets.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  APP_NAME: Proteus
  # Whether the build produces one self-contained file or a collect directory.
  # The packaging step needs to know; nothing else does.
  ONEFILE: "true"
  PYTHON_VERSION: "3.12"

jobs:
  # The release object is created — or corrected — before anything is built,
  # so the three matrix jobs always have somewhere to upload to, whichever
  # trigger started the run. It also means the description is written once,
  # from a file in the repository, instead of three times from three runners.
  release:
    name: Prepare the release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Work out which tag to build
        id: tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          case "$tag" in
            v[0-9]*) ;;
            *)
              echo "::error::'$tag' is not a version tag. Expected something like v1.2.3."
              exit 1
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # The notes live in .github/release-body.md, next to this file, so the
      # text a downloader reads can be edited without touching a workflow.
      # GitHub's own --generate-notes is deliberately not used: it emits the
      # commit log, which is engineering shorthand, not a description of what
      # is being downloaded.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          notes="$(sed "s/{{VERSION}}/$VERSION/g; s/{{TAG}}/$TAG/g" .github/release-body.md)"
          title="$APP_NAME $TAG"
          # `gh release create` fails outright when a release already exists
          # for the tag — the normal case when the tag was created by
          # publishing a release through GitHub's own UI, and when a moved tag
          # lands on a release that is already there. The fallback converges on
          # the same state: same title, same notes, and published rather than
          # left as an invisible draft.
          gh release create "$TAG" --title "$title" --notes "$notes" \
            || gh release edit "$TAG" --title "$title" --notes "$notes" --draft=false

      # A release the tag was moved onto still carries the assets of whatever
      # was published there before. They are not overwritten by name — the
      # archives below are named after the platform and the version, and an
      # older scheme's file simply sits alongside them, offering a download
      # that no longer matches the notes above it.
      - name: Remove assets left by a previous build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          keep=""
          for asset in "windows-x64.zip" "macos-arm64.zip" "linux-x64.tar.gz"; do
            keep="$keep $APP_NAME-$VERSION-$asset"
          done
          # The checksums used to be assets too, and are deliberately not on
          # this list any more: they belong in the notes, and any .sha256 left
          # over from a build that published them should go.
          for name in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
            case " $keep " in
              *" $name "*) ;;
              *)
                echo "removing stale asset: $name"
                gh release delete-asset "$TAG" "$name" --yes
                ;;
            esac
          done

  build:
    name: ${{ matrix.label }}
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64)
            asset: windows-x64
          - os: macos-latest
            label: macOS (arm64)
            asset: macos-arm64
          - os: ubuntu-latest
            label: Linux (x64)
            asset: linux-x64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install the platform's system libraries
        if: runner.os == 'Linux'
        run: |
          # tkinter is a separate OS package on Debian/Ubuntu. The interpreter
          # actions/setup-python installs ships _tkinter.so, but it is linked
          # against libtcl/libtk, which arrive with python3-tk.
          #
          # xvfb is for the smoke test: starting Tk needs a display, and a
          # build runner has none.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt pulls in requirements.txt, which carries
          # PyInstaller, plus pytest.
          pip install -r requirements-dev.txt

      - name: Build
        run: python build.py

      # The v1 archives shipped one executable and no licence file at all.
      # A recursive search of all three for LICENSE, COPYING or NOTICE
      # returned nothing, which the BSD and MIT libraries frozen into that
      # executable require, and which the LGPL-2.1 system libraries collected
      # on Linux require in stronger terms still.
      #
      # Run here rather than from the .spec file because these are --onefile
      # builds: anything added to the bundle ends up sealed inside the
      # executable, visible only to somebody who has already run it. The tree
      # is packaged beside the binary instead.
      - name: Collect the licence texts
        shell: bash
        run: python tools/collect_licences.py build/licenses

      # What the archive actually contains, generated on the machine that
      # built it. A hand-written list would be wrong the first time the runner
      # image changed, and nobody would notice.
      #
      # A non-zero exit means some binary could not be attributed. That is
      # worth seeing, and worth seeing as a warning rather than as a failed
      # release: the report still lists it as unresolved, which is the honest
      # answer, and blocking a release on it would only encourage guessing.
      - name: Inventory what the bundle ships
        shell: bash
        run: |
          set +e
          python tools/licence_inventory.py \
            --bundle "${{ matrix.asset }}=build/$APP_NAME" \
            --markdown "build/licenses/THIRD-PARTY-LICENSES-${{ matrix.asset }}.md"
          status=$?
          set -e

          # 2 means the report was written and some rows in it need a human.
          # Anything else means the script did not finish, and the archive
          # would ship without the inventory it is supposed to carry. The
          # first release run swallowed exactly that: the script raised on
          # every machine without dpkg, `|| echo ::warning::` turned the crash
          # into a warning, and Windows and macOS published without it.
          case "$status" in
            0) ;;
            2) echo "::warning::some binaries could not be attributed; see the report" ;;
            *) echo "::error::the inventory script exited $status without writing a report"
               exit "$status" ;;
          esac

      # Where the build put its output, and which file inside it is the
      # program. Decided once, here, so the smoke test and the packaging step
      # cannot end up disagreeing about what ships.
      - name: Locate what was built
        id: built
        shell: bash
        run: |
          suffix=""
          [ "$RUNNER_OS" = "Windows" ] && suffix=".exe"

          if [ "$ONEFILE" = "true" ]; then
            payload="dist/$APP_NAME$suffix"
            bin="$payload"
          elif [ "$RUNNER_OS" = "macOS" ] && [ -d "dist/$APP_NAME.app" ]; then
            payload="dist/$APP_NAME.app"
            bin="dist/$APP_NAME.app/Contents/MacOS/$APP_NAME"
          else
            payload="dist/$APP_NAME"
            bin="dist/$APP_NAME/$APP_NAME$suffix"
          fi

          if [ ! -e "$payload" ]; then
            echo "::error::the build produced nothing at $payload"
            ls -la dist || true
            exit 1
          fi
          echo "payload=$payload" >> "$GITHUB_OUTPUT"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      # A bundle that cannot start is worse than no bundle, so it is run
      # before it is offered for download.
      #
      # --version alone is not a smoke test. argparse prints the version and
      # exits before the toolkit is imported, so it proves the frozen
      # interpreter and the bundled standard library work and nothing else: a
      # bundle whose Tcl/Tk libraries were not collected passes it, and a
      # bundle that cannot save a file passes it too. --self-check starts Tk
      # for real, reports which windowing system it came up on, and writes and
      # reads back a file through the product's own code.
      #
      # The report is read from a file rather than from stdout because these
      # bundles are built --windowed: on Windows the process has no stdout at
      # all, so parsing it would check nothing on the one platform whose
      # bundle is least like the machine that built it.
      - name: Smoke-test the bundle
        shell: bash
        env:
          BIN: ${{ steps.built.outputs.bin }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          chmod +x "$BIN" 2>/dev/null || true

          # The tag names the archive; this is the version the program itself
          # reports, and nothing until now made the two agree. A tag alone
          # would happily produce $APP_NAME-1.0.0-windows-x64.zip containing a
          # program that says 2.3.0 when asked -- a download whose name and
          # contents disagree, which is the one thing a release must not be.
          #
          # tr -d because a Windows build prints CRLF and the comparison would
          # fail on the carriage return alone.
          reported=$("$BIN" --version | tr -d '\r')
          echo "$reported"
          case "$reported" in
            *" $VERSION") ;;
            *)
              echo "::error::the tag says $VERSION but the program says '$reported'"
              echo "::error::update the version in the source, or tag the version the source has"
              exit 1
              ;;
          esac

          if [ "$RUNNER_OS" = "Linux" ]; then
            # Under a virtual X server, so Tk loads the real x11 backend.
            xvfb-run -a "$BIN" --self-check --self-check-report self-check.txt
          else
            "$BIN" --self-check --self-check-report self-check.txt
          fi
          cat self-check.txt

          backend=$(sed -n 's/^windowing system: //p' self-check.txt)
          case "$RUNNER_OS:$backend" in
            Linux:x11|macOS:aqua|Windows:win32) ;;
            *)
              echo "::error::$RUNNER_OS bundle came up on windowing system '$backend'"
              exit 1
              ;;
          esac
          # Proteus is a GUI *and* a command line in one binary, so the CLI
          # half is smoke-tested too.
          "$BIN" --help > /dev/null

      # The archive is a folder now, not a bare executable: the licence texts
      # have to travel with the binary, and a folder is the only way to put
      # them where somebody who unpacks the download will see them.
      - name: Assemble what goes in the archive
        id: staged
        shell: bash
        env:
          PAYLOAD: ${{ steps.built.outputs.payload }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # Named after the tool and nothing else. It used to carry the
          # version and the platform too, which is information the file it
          # came out of already has, and which left three different folder
          # names on one person's disk for the same program.
          staged="staging/$APP_NAME"
          rm -rf staging
          mkdir -p "$staged"
          cp -R "$PAYLOAD" "$staged/"
          cp -R build/licenses "$staged/licenses"

          # The start script, and the digest it checks the executable against.
          #
          # That digest travels in the same archive as the executable, so it
          # catches a truncated download or a half-finished unpack -- the
          # failure that actually happens to people -- and not tampering,
          # since whoever could replace the one could replace the other. The
          # checksums in the release notes are the ones that answer that,
          # because they arrive by a route the archive did not.
          case "$RUNNER_OS" in
            Windows)
              cp packaging/start.cmd "$staged/start.cmd"
              named="$APP_NAME.exe"
              sums="$staged/$APP_NAME.exe.sha256"
              ;;
            macOS)
              # .command rather than .sh, so Finder will run it on a
              # double-click instead of opening it in an editor.
              cp packaging/start.sh "$staged/start.command"
              chmod +x "$staged/start.command"
              named="$APP_NAME"
              sums="$staged/$APP_NAME.sha256"
              ;;
            *)
              cp packaging/start.sh "$staged/start.sh"
              chmod +x "$staged/start.sh"
              named="$APP_NAME"
              sums="$staged/$APP_NAME.sha256"
              ;;
          esac

          # Written in the format `sha256sum -c` reads, with the name relative
          # to the file itself, so the archive can be checked with a tool and
          # not only by the launcher.
          python - "$staged/$named" "$sums" "$named" <<'PY'
          import hashlib
          import pathlib
          import sys

          target, out, name = sys.argv[1:4]
          with open(target, "rb") as handle:
              digest = hashlib.file_digest(handle, "sha256").hexdigest()
          pathlib.Path(out).write_text(f"{digest}  {name}\n", encoding="utf-8")
          print(f"{digest}  {name}")
          PY

          ls -la "$staged"
          echo "dir=$staged" >> "$GITHUB_OUTPUT"

      # A launcher that refuses to launch is worse than no launcher, and one
      # that launches whatever it finds is decoration. Both halves are checked
      # here, on the copy that is about to be packaged.
      - name: Start the bundle through the launcher
        shell: bash
        env:
          ROOT: ${{ steps.staged.outputs.dir }}
        run: |
          # Everything here runs on a copy, never on the directory about to be
          # packaged. Some of these programs create folders next to themselves on
          # first run, and a check that leaves its own droppings inside the
          # archive has broken the thing it was there to protect.
          rm -rf "$RUNNER_TEMP/launchcheck"
          cp -R "$ROOT" "$RUNNER_TEMP/launchcheck"
          CHECK="$RUNNER_TEMP/launchcheck"

          case "$RUNNER_OS" in
            # `cmd //c` and not `cmd /c`: Git Bash rewrites a lone leading
            # slash into a Windows path, and the doubled one survives that as
            # the /c cmd expects.
            Windows) launch="cmd //c start.cmd"; sums="$CHECK/$APP_NAME.exe.sha256" ;;
            macOS)   launch="./start.command";   sums="$CHECK/$APP_NAME.sha256" ;;
            *)       launch="./start.sh";        sums="$CHECK/$APP_NAME.sha256" ;;
          esac

          # --- it starts the program ------------------------------------------------
          #
          # Checked by the report the program writes, not by what it prints: these
          # bundles are built --windowed, and a file on disk is proof it really ran
          # on every platform without having to reason about whether this one has a
          # stdout to read.
          report=launcher-check.txt
          if [ "$RUNNER_OS" = "Linux" ]; then
            ( cd "$CHECK" && xvfb-run -a $launch --self-check --self-check-report "$report" )
          else
            ( cd "$CHECK" && $launch --self-check --self-check-report "$report" )
          fi
          if [ ! -s "$CHECK/$report" ]; then
            echo "::error::the launcher did not start $APP_NAME"
            exit 1
          fi
          cat "$CHECK/$report"

          # --- it waits for the window, and stops waiting when there is one ---------
          #
          # The path a double-click takes, which nothing used to run. Reported from
          # Proteus: the launcher sat out its whole timeout and then announced that
          # the program had not opened a window, while the program was on screen.
          # The wait was on the process Start-Process returned, and a onefile build
          # is two processes -- the bootloader that starts and the child that draws
          # the window.
          #
          # stdout is sent to a file rather than captured, because the program
          # inherits it: $( ) would wait for the program to exit, not for the
          # launcher. Learned by making exactly that mistake in a test harness.
          if [ "$RUNNER_OS" = "Windows" ]; then
            ( cd "$CHECK" && PROTEUS_LAUNCH_TIMEOUT=90 cmd //c start.cmd ) > launcher.log 2>&1
            status=$?
            cat launcher.log || true

            running=$(tasklist //FI "IMAGENAME eq $APP_NAME.exe" //NH 2>/dev/null \
                        | grep -c "$APP_NAME" || true)
            taskkill //F //IM "$APP_NAME.exe" > /dev/null 2>&1 || true

            if [ "$running" -gt 0 ] && [ "$status" -ne 0 ]; then
              echo "::error::the launcher gave up (exit $status) while $APP_NAME was running"
              exit 1
            fi
            if [ "$status" -eq 0 ]; then
              echo "the launcher waited for the window and closed on its own"
            else
              # Not a failure of the launcher: if the program never came up at all,
              # there was no wait to exercise. Said out loud rather than passed over,
              # because a check that quietly tests nothing is worse than no check.
              echo "::warning::$APP_NAME opened no window on this runner (launcher exit $status)"
            fi
          fi

          # --- it refuses a mismatched checksum -------------------------------------
          #
          # A launcher that verifies nothing passes everything above on its own. The
          # recorded digest is corrupted rather than the executable, and this is the
          # copy, so nothing that ships is written to either way.
          python - "$sums" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          digest, _, rest = path.read_text(encoding="utf-8").partition("  ")
          # A digest of the right shape and the wrong value: the launcher has to
          # reject it on the comparison, not on failing to parse it.
          path.write_text(f"{'f' * len(digest)}  {rest}", encoding="utf-8")
          PY

          if ( cd "$CHECK" && $launch --version ) > /dev/null 2>&1; then
            echo "::error::the launcher started a binary that failed its checksum"
            exit 1
          fi
          echo "the launcher refuses a mismatched checksum"

          rm -rf "$CHECK"

      - name: Package
        id: package
        shell: bash
        env:
          STAGED: ${{ steps.staged.outputs.dir }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          base="$APP_NAME-$VERSION-${{ matrix.asset }}"
          case "$RUNNER_OS" in
            Windows)
              name="$base.zip"
              # 7z ships on the Windows runner image and, unlike
              # Compress-Archive, keeps the top-level folder. It keeps the
              # *whole path* it is given, though: called on staging/<base> it
              # produced an archive that unpacked to staging/<base>/, one
              # level deeper than the other two platforms. Run from inside the
              # staging directory instead, so all three archives unpack the
              # same way.
              ( cd "$(dirname "$STAGED")" \
                  && 7z a -tzip "../$name" "$(basename "$STAGED")" > /dev/null )
              ;;
            macOS)
              name="$base.zip"
              # ditto keeps the symlinks and permission bits inside a .app
              # bundle; zip flattens them and a flattened bundle will not
              # launch.
              ditto -c -k --keepParent "$STAGED" "$name"
              ;;
            *)
              name="$base.tar.gz"
              tar -czf "$name" -C "$(dirname "$STAGED")" "$(basename "$STAGED")"
              ;;
          esac
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -la "$name"

      # These builds are unsigned, so Windows tells whoever downloads one that
      # the publisher is unknown and offers to not run it. Nothing here can
      # remove that — only a code-signing certificate can — but a published
      # checksum is what lets a cautious person answer the question the
      # warning actually raises: is this the file the build produced, or
      # something that replaced it on the way here.
      #
      # Computed with Python rather than sha256sum or certutil: setup-python
      # has already run on all three runners, so one line means the same thing
      # everywhere, and file_digest reads in chunks rather than pulling a
      # large archive into memory.
      - name: Record the checksum
        id: checksum
        shell: bash
        env:
          ASSET: ${{ steps.package.outputs.name }}
        run: |
          python - "$ASSET" <<'PY'
          import hashlib
          import pathlib
          import sys

          archive = pathlib.Path(sys.argv[1])
          with archive.open("rb") as handle:
              digest = hashlib.file_digest(handle, "sha256").hexdigest()
          # The format sha256sum -c reads, so it can be checked with a tool
          # rather than by eye.
          pathlib.Path(f"{archive.name}.sha256").write_text(
              f"{digest}  {archive.name}\n", encoding="utf-8"
          )
          print(f"{digest}  {archive.name}")
          PY

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          ASSET: ${{ steps.package.outputs.name }}
        run: gh release upload "$TAG" "$ASSET" --clobber

      # The digest goes up as a workflow artifact rather than a release asset.
      # It still has to reach the release page -- a checksum is only worth
      # anything if it arrives by a route the archive did not -- but three
      # more files in the download list is not the way. The job at the end of
      # this file collects the three and writes them into the notes.
      - name: Hand the checksum to the notes job
        uses: actions/upload-artifact@v4
        with:
          name: checksum-${{ matrix.asset }}
          path: ${{ steps.package.outputs.name }}.sha256
          if-no-files-found: error
          retention-days: 1
  # Where the checksums end up.
  #
  # They were release assets until people started downloading these builds and
  # found three extra files in the list for every one they wanted. What a
  # checksum has to do is arrive by a route the archive did not, so that a
  # replaced archive cannot quietly carry a matching digest — and the notes
  # GitHub renders on the release page are exactly such a route. Being read
  # rather than downloaded is if anything the point: it is the archive that
  # gets copied around, not the page.
  #
  # This runs after all three builds, because a partial list is worse than
  # none: a reader who finds two of three has no way to tell whether the third
  # is missing or merely unlisted.
  checksums:
    name: Write the checksums into the notes
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: checksum-*
          path: checksums
          merge-multiple: true

      - name: Write them into the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release view "$TAG" --json body --jq .body > body.md
          python3 - body.md checksums <<'PY'
          import pathlib
          import sys

          body_path, digests = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])

          # Ordered by the archive's name, not by the digest, so the three
          # lines read in the same order as the table above them.
          lines = sorted(
              (path.read_text(encoding="utf-8").strip()
               for path in digests.glob("*.sha256")),
              key=lambda line: line.split("  ", 1)[-1],
          )
          if not lines:
              raise SystemExit("no checksums were handed up by the build jobs")

          listing = "\n".join(lines)
          block = (
              "<!-- checksums -->\n"
              "### Checksums\n\n"
              "SHA-256 of each archive as the build machine produced it. These "
              "are on this page rather than in the archives on purpose: a "
              "digest that travels with the file it describes can only tell "
              "you the file is undamaged.\n\n"
              f"```\n{listing}\n```\n"
              "<!-- /checksums -->"
          )

          body = body_path.read_text(encoding="utf-8")
          head, marker, rest = body.partition("<!-- checksums -->")
          if marker:
              # A re-run rewrites its own block rather than stacking another
              # one under it.
              _, _, tail = rest.partition("<!-- /checksums -->")
              body = head + block + tail
          else:
              body = body.rstrip("\n") + "\n\n" + block + "\n"

          body_path.write_text(body, encoding="utf-8")
          print(body)
          PY
          gh release edit "$TAG" --notes-file body.md
