name: Build Windows executable

# On-demand build of the real, distributable Proteus.exe.
#
# ci.yml already builds and smoke-tests the same executable on every push —
# that job exists to catch a broken build early, and its artifact expires with
# the run and needs a GitHub login to download even on a public repo. Two ways
# to get the real thing out of this workflow instead:
#
#   * Actions tab -> "Run workflow" -> download the run's Artifact. Quick, but
#     still a login-gated, expiring workflow artifact — fine for "let me just
#     check this builds", not for handing someone a link.
#   * Push a tag matching "v*" (e.g. v1.3). This does everything the manual
#     run does, and additionally publishes a GitHub Release for that tag with
#     Proteus.exe attached as a release asset. Release assets are public with
#     no login required, and they do not expire — this is the one to use for
#     "here, download Proteus".
#
# Either way it runs on a genuine windows-latest runner — the only way to
# produce a real Windows executable without a Windows machine of your own.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# gh release create needs write access to repository contents; the default
# GITHUB_TOKEN is read-only on repos/orgs that have tightened the default, so
# this is requested explicitly rather than relying on that setting.
permissions:
  contents: write

jobs:
  build:
    name: Build Proteus.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # requirements-dev.txt pulls in requirements.txt (which has pyinstaller)
      # plus pytest, so one install covers both steps below.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # A manual dispatch can target any branch, including one ci.yml never
      # tested — so this workflow verifies for itself rather than trusting
      # that the ref already passed elsewhere.
      - name: Run the test suite
        run: python -m pytest

      - name: Build
        run: python build.py

      - name: Smoke-test the executable
        run: |
          dist\Proteus.exe --version
          dist\Proteus.exe --help

      - uses: actions/upload-artifact@v4
        with:
          name: Proteus-windows-exe
          path: dist/Proteus.exe
          if-no-files-found: error

      # Only when this run was triggered by a tag: a manual dispatch has no
      # tag to attach a release to. `gh` ships preinstalled on GitHub-hosted
      # runners, so no extra action or credential is needed beyond the token.
      #
      # --generate-notes reads the commit log since the last tag. That fits a
      # repo built on PRs; this one pushes straight to main, so the "notes"
      # would just be the latest commit message — internal engineering text,
      # not something a downloader should read as "what's new". A short fixed
      # blurb replaces it.
      #
      # `gh release create` fails outright if a release for this tag already
      # exists — which happens if the tag was made via GitHub's "Draft a new
      # release" page, since that creates the release object together with
      # the tag. The fallback covers that: `gh release edit` applies the same
      # title/notes to the pre-existing release, then the asset is attached
      # either way.
      - name: Publish a GitHub Release with the executable attached
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TITLE: "Proteus ${{ github.ref_name }}"
          RELEASE_NOTES: >-
            Standalone Windows executable — no Python installation needed.
            Download Proteus.exe below and run it: double-click for the
            interface, or `Proteus.exe --help` from a terminal for the
            command line (including `--audit`, which reports without ever
            writing anything).
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Proteus.exe \
            --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES" \
          || {
            gh release edit "$GITHUB_REF_NAME" --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES"
            gh release upload "$GITHUB_REF_NAME" dist/Proteus.exe --clobber
          }
