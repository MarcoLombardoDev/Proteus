name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Su Linux tkinter e' un pacchetto separato e serve un display virtuale
      # per i test dell'interfaccia.
      - name: Installa tkinter e Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Test (Linux, headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest

  # Verifica che l'eseguibile si compili davvero, cosi' una build rotta
  # emerge in CI e non al momento della distribuzione.
  build:
    name: Build eseguibile
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compila
        run: python build.py

      - uses: actions/upload-artifact@v4
        with:
          name: RebrandingTool-windows
          path: dist/RebrandingTool.exe
          if-no-files-found: error
