name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # First, because it answers in under a minute and it answers for every file,
  # including the ones no test imports. The rules are the ones the sibling
  # products use, in ruff.toml; a finding here is a finding there.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # On Linux tkinter is a separate package and the interface tests need a
      # virtual display.
      - name: Install tkinter and Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Test (Linux, headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest

  # Verify the executable really builds, so a broken build surfaces in CI
  # rather than at distribution time.
  build:
    name: Build executable
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build
        run: python build.py

      # One executable serves both the interface and the command line: it is
      # built --console (so the CLI half actually prints) and main.py hides
      # the console window itself when no arguments are given.
      - name: Smoke-test the command line
        run: |
          dist\Proteus.exe --version
          dist\Proteus.exe --help

      - uses: actions/upload-artifact@v4
        with:
          name: Proteus-windows
          path: dist/Proteus.exe
          if-no-files-found: error
